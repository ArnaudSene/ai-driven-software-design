name: Check guide

on:
  push:
  pull_request:

jobs:
  acronyms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check acronyms and glossary
        run: python3 scripts/check_acronyms.py
      - name: Check links, anchors and guide paths
        run: python3 scripts/check_links.py
      - name: Check that the French translation follows the English
        run: python3 scripts/check_translation.py
